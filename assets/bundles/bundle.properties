# Venturia - English bundle
# Keys use the full content name (with the mod prefix): <type>.<content-name>.<key>

planet.venturia-planet.name = Venturia
planet.venturia-planet.description = A third planet where the wind is the main source of power.

weather.venturia-gale.name = Gale
weather.venturia-gale.description = A strong wind rises over the planet.

weather.venturia-calm.name = Calm
weather.venturia-calm.description = The wind dies down and the air turns still.

block.venturia-wind-turbine.name = Wind turbine
block.venturia-wind-turbine.description = Converts wind into power. The output scales with the wind strength.

block.venturia-wind-wheel.name = Wind wheel
block.venturia-wind-wheel.description = A small wind turbine. Cheap and compact, but weak: the output scales with the wind strength.

block.venturia-cobalt-forge.name = Cobalt forge
block.venturia-cobalt-forge.description = Smelts copper and lead into a cobalt alloy. Requires power.

block.venturia-cobalt-wall.name = Cobalt wall
block.venturia-cobalt-wall.description = A strong wall made of cobalt alloy.

block.venturia-cobalt-wall-large.name = Large cobalt wall
block.venturia-cobalt-wall-large.description = A strong wall made of cobalt alloy. Covers four tiles.

item.venturia-cobalt.name = Cobalt
item.venturia-cobalt.description = A durable blue alloy smelted from copper and lead. The main building material of Venturia.
