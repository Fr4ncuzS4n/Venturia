# Venturia - Russian bundle
# Ключи используют полное имя контента (с префиксом мода): <тип>.<имя-контента>.<ключ>

planet.venturia-planet.name = Вентурия
planet.venturia-planet.description = Третья планета, где главный источник энергии — ветер.

weather.venturia-gale.name = Шторм
weather.venturia-gale.description = Над планетой поднимается сильный ветер.

weather.venturia-calm.name = Штиль
weather.venturia-calm.description = Ветер стихает, воздух замирает.

block.venturia-wind-turbine.name = Ветрогенератор
block.venturia-wind-turbine.description = Преобразует ветер в энергию. Мощность зависит от силы ветра.

block.venturia-wind-wheel.name = Ветряк
block.venturia-wind-wheel.description = Небольшая ветряная турбина. Дешёвая и компактная, но слабая: мощность зависит от силы ветра.

block.venturia-cobalt-forge.name = Кобальтовая плавильня
block.venturia-cobalt-forge.description = Плавит медь и свинец в кобальтовый сплав. Требует энергию.

block.venturia-cobalt-wall.name = Кобальтовая стена
block.venturia-cobalt-wall.description = Прочная стена из кобальтового сплава.

block.venturia-cobalt-wall-large.name = Большая кобальтовая стена
block.venturia-cobalt-wall-large.description = Прочная стена из кобальтового сплава. Занимает четыре клетки.

item.venturia-cobalt.name = Кобальт
item.venturia-cobalt.description = Прочный синий сплав, выплавляемый из меди и свинца. Основной строительный материал Вентурии.
